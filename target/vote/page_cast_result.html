Importanbt data attributes are data-action, data-section. These are both used for
command and simplify navigation in page.

PAGE_ Method documentation:
=========================

PAGE_Initialize - Initialize the page by creating necessary objects and loading initial data
PAGE_SetListeners - Set event listeners for user interactions on the page
PAGE_Load - Load poll information from the server and store it in the document

/** --------------------------------------------------------------------------- PAGE_Load
 * Load poll information from the server and store it in the document
 * 
 * This function fetches all necessary information for the poll, including poll
 * details, questions, and answers. It executes multiple queries in parallel to
 * optimize loading time. The results are stored in the document for later use
 * when rendering the poll on the page.
 */
async function PAGE_Load() {
   const sPollKey = oDocument_g.GetValue("PollKey");
   console.assert(sPollKey, "Poll key is not set in document");

   const aQueryName = ["cast-poll", "cast-poll_questions", "cast-poll_answers", "cast-poll_votes"];
   // const aQueryName = ["cast-poll"];
      
   try {
      // ## Execute all queries in parallel
      const aTable = await Promise.all(aQueryName.map(async (sQueryName) => {
         const oResult = await gd.SendToServer("", "!db/select?ui=1&", `query=#${sQueryName}\nvalues={"PollK":"${sPollKey}"}`);
         const data_ = oResult.data;

         const eResult = data_.querySelector("result") || console.error("No result element found in response for query:", sQueryName, "Response data:", data_);
         const sResultName = eResult.getAttribute("name");
         const sResultId = eResult.getAttribute("id");
         let sResultUi = eResult.getAttribute("ui");

         let oTable; // Generated table from result
         const aResult = JSON.parse(eResult.textContent);

         if( sResultUi ) { 
            if( sResultUi.charAt(0) === "{" ) { // If ui attribute is a JSON string, parse it to get table configuration
               const oUiConfig = JSON.parse(sResultUi);
               sResultUi = oUiConfig.table; // Get table name from UI configuration for later use
            }
            oTable = new Table(sResultUi); 
            oTable.Add(aResult.slice(1)); // Parse rows from UI format if available
         }
         else if( eResult.textContent ) {
            oTable = new Table(aResult);
         }
         else { console.error("No data found in result for query:", sQueryName, "Result element:", eResult); }
         
         if (sQueryName === "cast-poll") { oTable.name = "TPoll"; }
         else if (sQueryName === "cast-poll_questions") { oTable.name = "TPollQuestion"; }
         else if (sQueryName === "cast-poll_answers") { oTable.name = "TPollAnswer"; }
         else if (sQueryName === "cast-poll_votes") { oTable.name = "TPollVote"; }
         
         oDocument_g.AddTable(oTable);
         return oTable;
      }));

      // console.log("All poll data loaded:", aTable);
      
      // All done - render
      PAGE_RenderPoll();
      
   } 
   catch(error) { console.error("Failed to load poll data:", error); }
}

/** --------------------------------------------------------------------------- PAGE_Validate
 * Validate user input before sending votes to server
 * 
 * This function checks that the user has selected the required number of answers for each question based on the FMinSelect and FMaxSelect values defined for each question. If any validation fails, it shows an appropriate message to the user and prevents the form from being submitted.
 * 
 * @param {string} sType - The type of validation to perform, in this case "cast" for casting votes
 * @returns {boolean} - Returns true if validation passes, false otherwise
 */
function PAGE_Validate( sType ) {
   let bValid = true;
   if( sType === "cast" ) {
      // ## Validate that at least one answer is selected for each question
      const ePollContainer = document.getElementById("idPoll");
      const aQuestion = ePollContainer.querySelectorAll(`div[data-field="PollQuestionK"]`);
      aQuestion.forEach((eQuestion) => {
         const eRecord = eQuestion.querySelector(`[data-section="record"]`); 
         const sQuestionKey = eRecord.getAttribute("data-value");
         const uMinSelect = parseInt(eRecord.querySelector(`[data-field="FMinSelect"]`).value) || 0;
         const uMaxSelect = parseInt(eRecord.querySelector(`[data-field="FMaxSelect"]`).value) || 0;

         const aSelectedAnswers = eQuestion.querySelectorAll(`.vote-answer-input:checked`);
         const uSelectedCount = aSelectedAnswers.length;
         if( uSelectedCount < uMinSelect ) {
            bValid = false;
            oToast_g.Show(`Please select at least ${uMinSelect} answer(s) for question "${eQuestion.querySelector(`[data-field="FName"]`).textContent}"`);
         }
         else if( uMaxSelect > 0 && uSelectedCount > uMaxSelect ) {
            bValid = false;
            oToast_g.Show(`Please select no more than ${uMaxSelect} answer(s) for question "${eQuestion.querySelector(`[data-field="FName"]`).textContent}"`);
         }
      });
   }

   return bValid;
}
