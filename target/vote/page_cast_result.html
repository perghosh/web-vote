<!--
@FILE [tag: result] [description: page for displaying poll results after voting] [name: page_cast_result.html]

Importanbt data attributes are data-action, data-section. These are both used for
command and simplify navigation in page.

PAGE_ Method documentation:
=========================

PAGE_Initialize - Initialize the page by creating necessary objects and loading initial data
PAGE_SetListeners - Set event listeners for user interactions on the page
PAGE_Load - Load poll information from the server and store it in the document
PAGE_LoadFilterResults - Load filtered poll information based on selected answers and render graphs inside the vote graphs
PAGE_Render - Render the poll results on the page using the loaded data

Queries used in page ==========================================================
#cast-poll - Fetch main poll information based on poll key
#cast-poll_questions - Fetch questions related to the poll
#cast-poll_answers_and_count - Fetch answers related to the poll along with their vote counts

Id's of html elements used in page ============================================
idPage - Main container for the page
idPoll - Container for poll information (title, description, tags)
idTags - Container for poll tags
idQuestions - Container for poll questions and answers

-->

<!DOCTYPE html>
<html lang="sv" id="idRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/variables/variables-color-default.css">
    <link rel="stylesheet" href="css/poll.css">
    <link rel="stylesheet" href="css/elements.css">
    <link rel="stylesheet" href="css/input-effects.css">
    <script src="js/gd_ui_toast.js"></script>
    <script src="js/gd_ui_tablelite.js"></script>
    <script src="js/gd_data_table.js"></script>
    <script src="js/gd_db.js"></script>
    <script src="js/gd_server.js"></script>
    <script src="js/document.js"></script>
    <script src="js/i18n.js" defer></script>
    <title>Result and filter - Web Vote</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      .page-command { align-items: center; border: none; border-radius: 80px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); cursor: pointer; display: flex; font-family: inherit; font-size: 1.2rem; font-weight: 600; gap: 12px; justify-content: center; padding: 1rem 0; transition: all 0.2s ease; width: 100%; }
      @media (max-width: 640px) { .vote-answer-box { margin-top: 1px; } .vote-answer-option { align-items: flex-start; } }

      /* bar styles*/
      .page-bar { background: var(--chart-background, var(--color-border)); border-radius: 12px; height: 24px; overflow: hidden; position: relative; width: 100%; }
      .page-fill { background: var(--chart-primary, var(--background-success)); border-radius: 12px; height: 100%; position: relative; z-index: 1; }
      .page-fill-filter { background: var(--chart-secondary, var(--background-info)); border-radius: 999px; height: 50%; left: 0; position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; }

      /* layout for bars and sections for bars (questons and answers) */
      .page-answer-block { padding-bottom: 16px; margin-bottom: 12px; }
      .page-answer-block:not(:last-child) { border-bottom: 1px solid var(--color-border); }

      .page-answer-row { align-items: center; column-gap: 14px; display: grid; grid-template-columns: 88px 1fr; }

      [data-id="SelectVote"] { align-items: center; border-radius: 14px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; padding: 1px 6px; transition: background-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease; }
      .page-answer-percentage { align-items: baseline; display: inline-flex; justify-content: center; line-height: 1; white-space: nowrap; }
      .page-answer-count { display: flex; justify-content: center; line-height: 1; white-space: nowrap; }
      .page-answer-percentage [data-id="VotePercent"] { font-size: 1.45rem; }
      .page-answer-percentage [data-id="VotePercentFilter"] { display: none; font-size: 0.82rem; margin-left: 4px; white-space: nowrap; }
      [data-id="SelectVote"][data-selected="1"] .page-answer-percentage [data-id="VotePercent"] { font-size: 0.82rem; }
      [data-id="SelectVote"][data-selected="1"] .page-answer-percentage [data-id="VotePercentFilter"] { display: inline; }
      [data-id="SelectVote"][data-selected="1"] { background: color-mix(in srgb, var(--chart-line, var(--background-primary)) 20%, transparent); box-shadow: inset 0 0 0 2px var(--color-active); transform: translateY(-1px); }
      

      .page-answer-content { display: grid; gap: 8px; }
      .page-answer-content [data-field="FAnswer"] { margin-bottom: 0; }

      .page-count-marker { background: var(--chart-line, var(--background-primary)); border-radius: 999px; color: var(--color-primary); display: inline-flex; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; margin-left: 10px; padding: 4px 10px; text-transform: uppercase; vertical-align: middle; }
      .page-count-marker [data-field="VoteCount"] { margin-right: 4px; }
      .page-tag { background: var(--background-info); border: 1px solid transparent; border-radius: 999px; color: var(--color-info); cursor: pointer; display: inline-flex; font-size: 0.8rem; font-weight: 700; margin-right: 10px; padding: 4px 10px; transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease; }
      .page-tag[data-marked="1"] { background: var(--chart-line, var(--background-primary)); border-color: var(--color-active); color: var(--color-primary); transform: translateY(-1px); }
      @media (max-width: 640px) { .page-answer-row { grid-template-columns: 72px 1fr; } .page-answer-percentage [data-id="VotePercent"] { font-size: 1.2rem; } .page-answer-percentage [data-id="VotePercentFilter"] { font-size: 0.72rem; } }
    </style>
</head>
<body>
   <!--
    | ## Page Container for poll result
    -->
   <div id="idPage" class="page-container container page" data-section="page">
      <!-- Poll information -->
      <div id="idPoll" class="container-view margin_b-small">
         <div style="align-items: flex-start; display: flex; gap: 16px; justify-content: space-between;">
            <div style="flex: 1 1 auto; min-width: 0;">
               <h1><span data-field="FName">Poll Title</span><span class="page-count-marker"><span data-field="VoteCount">0</span>röster</span></h1>
               <p data-field="FDescription">Poll description goes here...</p>
            </div>
            <a href="page_cast_list.html" class="page-tag" style="margin-right: 0; white-space: nowrap;">← <span data-i18n="link-BackToVoteList">Tillbaka till omröstningslistan</span></a>
         </div>
         <div id="idTags" class="margin_t-small">
            <!-- Tags will be rendered here based on loaded data -->
         </div>               
      </div>
      <!-- Questions and answers will be rendered here -->
      <div id="idQuestions" class="margin_b-small">
         <!-- Question and answer templates will be rendered here based on loaded data -->   
      </div>          
   </div>

   <!--
    | ## Poll question container
    -->
   <template id="idTemplateQuestion" data-description="question template">
      <div class="container-view margin_b-large" data-table="TPollQuestion">
         <div data-field="PollQuestionK" data-value="" data-table="TPollQuestion" data-description="key for question">
            <div data-section="record" data-table="TPollQuestion">
               <h3 class="margin_b-small" data-field="FName">Name...</h3>
               <p class="margin_b-large" data-field="FQuestion">Question text goes here...</p>
            </div>
            <div data-section="answer" class="margin_b-small">
               <!-- Answer options will be appended here based on answers linked to this question -->
            </div>
         </div>
      </div>
   </template>

   <!--
    | ## Poll answer container
    -->
   <template id="idTemplateAnswer" data-description="answer template">
      <div class="page-answer-block" data-table="TPollAnswer">
         <div data-field="PollAnswerK" data-value="" data-table="TPollAnswer" data-description="key for answer">
            <div data-section="record" data-table="TPollAnswer">
               <div class="page-answer-row" data-section="answer">
                  <div style="color: var(--chart-line, var(--color-active)); font-weight: 700;" data-id="SelectVote" data-action="select-vote">
                     <span class="page-answer-percentage" style="font-size: 1.45rem; line-height: 1; min-height: 20px;" data-id="VotePercent">0%</span>
                     <span class="page-answer-percentage" style="color: var(--chart-secondary); font-size: 0.85rem;" data-id="VotePercentFilter"></span>
                     <span class="page-answer-count" style="font-size: 1rem;" data-field="VoteCount">0</span>
                  </div>
                  <!-- Answer bar content, each answer bar is rendered using this html -->
                  <div class="page-answer-content">
                     <p class="margin_b-small" data-field="FAnswer">Answer text goes here...</p>
                     <div class="page-bar" data-field="VoteCount" data-value="">
                        <div data-target="bar" class="page-fill" style="width: 50%;"></div>
                        <div data-target="bar-filter" class="page-fill-filter"></div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </template>



<script>
'use strict';

let oDocument_g; // Global document object
let oToast_g;

// ## Prepare url ............................................................
const sUrl_g = gd.GetUrl();
gd.SetUrl(sUrl_g);
const sBaseUrl_g = gd.GetBaseUrl();
gd.SetBaseUrl(sBaseUrl_g);

// ## Initialize the page
document.addEventListener('DOMContentLoaded', function() {
   THEME_Select("color", {});
   PAGE_Initialize();
   //PAGE_SetListeners();
});

/** --------------------------------------------------------------------------- PAGE_Initialize
 * Initialize the page by creating necessary objects and loading initial data
 */
function PAGE_Initialize() {
   oDocument_g = new CDocument({});                                           // Create new document
   oToast_g = new UIToast(document.body, { sPosition: "top-right", iDuration: 3000 });

   let sPollK = null; // Get poll key from url parameters if available, otherwise use null to fetch first poll

   // try to get poll key from url parameters, if not available use null to fetch first poll
   const oUrlParameter = new URLSearchParams(window.location.search);
   sPollK = oUrlParameter.get("PollK") || oUrlParameter.get("key") || null;
   if( !sPollK || sPollK.length !== 32 ) { console.warn("No poll key or invalid poll key provided in URL parameters, fetching first poll");
      sPollK = null;                                                           // Set to null to fetch first poll
   }
   else { oDocument_g.SetValue("PollK", sPollK); }                            // Store poll key in document for later use

   if( sPollK ) {
      PAGE_Load();                                                            // Load poll information and display it on the page
   }
}

/** --------------------------------------------------------------------------- PAGE_Load
 * Load poll information from the server and store it in the document
 */
function PAGE_Load() {
   const sPollK = oDocument_g.GetValue("PollK");                              // Get poll key from document
   const aColumn = ["TPoll","PollK", sPollK ];                                // table, column and value to fetch poll information

   // ## Fetch poll information ...............................................
   const oXml = XML.CreateXML( "commands" );
   const poll_ = oXml.Command( "db/select", { query: "cast-poll", columns: JSON.stringify(aColumn) } );
   const poll_questions_ = oXml.Command( "db/select", { query: "cast-poll_questions", columns: JSON.stringify(aColumn) } );
   const poll_answers_and_count_ = oXml.Command( "db/select", { query: "cast-poll_answers_and_count", columns: JSON.stringify(aColumn) } );
   const poll_get_tags_ = oXml.Command( "db/select", { query: "tag-poll_get_tags", columns: JSON.stringify(aColumn) } );  

   gd.Send( "!xml", {}, oXml.Done()).then(function(oResult) {
      const oXml = oResult.data;

      [ [poll_, "TPoll"], [poll_questions_, "TPollQuestion"], [poll_answers_and_count_, "TPollAnswer"] ].forEach(([fnGetData, sTable]) => {
         const sData = fnGetData(oXml);
         if( !sData ) { console.error(`No data found in result for query: ${sTable}`, "Result element:", oXml); oToast_g.Show(`Failed to load poll information: No data found for ${sTable}`, { type: "error" }); return; }
         const aData = JSON.parse(sData);
         const oTable = new Table(aData, {sName: sTable});
         oDocument_g.AddTable(oTable);
      });

      {
         const sData = poll_get_tags_(oXml);
         if( sData ) { 
            const aData = JSON.parse(sData);
            const oTable = new Table(aData, {sName: "TTag"});
            oDocument_g.AddTable(oTable);
         }
      }

      PAGE_RenderResult();                                                     // Render the page with loaded data
   })
   .catch(function(e_) { 
      console.error("Failed to load poll information", e_); 
      oToast_g.Show("Failed to load poll information", { type: "error" });
   });

   PAGE_SetListeners();                                                       // Set event listeners for user interactions on the page
}

/** --------------------------------------------------------------------------- PAGE_LoadFilterResults
 * Load filtered poll information based on selected answers and store it in the document
 */
function PAGE_LoadFilterResults() {
   const sPollK = oDocument_g.GetValue("PollK");                              // Get poll key from document
   const aColumn = ["TPoll","PollK", sPollK ];                                // table, column and value to fetch poll information
   // ## Fetch filtered poll information .....................................
   const oXml = XML.CreateXML( "commands" );
   const poll_ = oXml.Command( "db/select", { query: "cast-poll_count_selected_answers", columns: JSON.stringify(aColumn) } );

   // ## Append answer array values to document for filtering ................
   const aSelectedAnswers = oDocument_g.GetValue("selected-answers") || [];
   if( aSelectedAnswers.length > 0 ) {
      
      // ### Set element to first child for commands (that is the command element)
      const eCommands = oXml.GetElement();
      oXml.SetElement(eCommands.firstElementChild);

      for( let i = 0; i < aSelectedAnswers.length; i++ ) {
         const sAnswerK = aSelectedAnswers[i];
         oXml.Append( "where", { table: "TPollAnswer", name: "PollAnswerK", value: sAnswerK, operator: "=" } );
      }
   }

   // ## Send request to server and handle response ..........................
   gd.Send( "!xml", {}, oXml.Done()).then(function(oResult) {
      const oXml = oResult.data;
      const sData = poll_(oXml);
      if( !sData ) { console.error(`No data found in result for query: cast-poll_count_selected_answers`, "Result element:", oXml); oToast_g.Show(`Failed to load filtered poll information: No data found for cast-poll_count_selected_answers`, { type: "error" }); return; }
      const aData = JSON.parse(sData);
      const oTable = new Table(aData, {sName: "TPollAnswer.Filtered"});

      // ## Remove existing filtered table if it exists and add new filtered table to document
      if( oDocument_g.HasTable("TPollAnswer.Filtered") ) { oDocument_g.RemoveTable("TPollAnswer.Filtered"); }
      oDocument_g.AddTable(oTable);

      PAGE_RenderFiltered();                                                  // Render the page with loaded data
   })
}

// --------------------------------------------------------------------------- PAGE_SetListeners
function PAGE_SetListeners() {
   // ## Listen to idTags for click events to filter results by tag ..........
   const eTags = document.getElementById("idTags");
   eTags.addEventListener("click", function(e_) {
      const eTag = e_.target.closest("span[data-key]");
      if( !eTag ) { return; }

      // ## add key to document with marked tags
      let sTags = oDocument_g.GetValue("selected-tags") || ""; // get selected tags in commana separated format
      const sTagK = eTag.dataset.key;

      // ### Find key in selected tags and remove empty values from split result
      const aSelectedTags = sTags.split(","). map(s => s.trim()).filter(s => s.length > 0);
      const iTagIndex = aSelectedTags.indexOf(sTagK);

      if( e_.ctrlKey ) {
         // ## If ctrl key is pressed, toggle tag in selected tags without navigating to list page
         if( iTagIndex > -1 ) {
            aSelectedTags.splice(iTagIndex, 1);                               // remove tag from selected tags
            eTag.dataset.marked = "0";                                        // unmark tag
         }
         else {
            aSelectedTags.push(sTagK); // add tag to selected tags
            eTag.dataset.marked = "1";                                        // mark tag                                     
         }
         oDocument_g.SetValue("selected-tags", aSelectedTags.join(",")); // update document with new selected tags
         return;
      }

      if( iTagIndex === -1 ) { aSelectedTags.push(sTagK); }                   // If tag is not already in selected tags, add it

      // ## Open list of votes and pass filter for selected tag ..............
      const sUrl = `page_cast_list.html?tag=${aSelectedTags.join(",")}`;
      window.location.href = sUrl;
   });

   const eQuestions = document.getElementById("idQuestions");
   eQuestions.addEventListener("click", function(e_) {
      const eTarget = e_.target;
      const sAction = eTarget.closest('[data-action]')?.dataset.action;
      if( !sAction ) { return; }                                              // disable for all scenarios not related to actions

      switch(sAction) {
         case "select-vote": {
            const eSelected = eTarget.closest("[data-id='SelectVote']");
            const eAnswer = eSelected?.closest("[data-field='PollAnswerK']");
            if( !eSelected || !eAnswer ) { console.warn("No answer element found for select-vote action"); return; }

            const sPollAnswerK = eAnswer.dataset.value; // Get the key of the selected answer
            
            if( eSelected.dataset.selected === "1" ) {
               eSelected.dataset.selected = "0"; // Deselect if already selected
               oDocument_g.RemoveFromArray("selected-answers", sPollAnswerK); // Remove selected answer key from document
            } else {
               eSelected.dataset.selected = "1"; // Select the clicked vote
               oDocument_g.AddToArray("selected-answers", sPollAnswerK);      // Add selected answer key 
            }

            PAGE_LoadFilterResults();                                         // Load filtered results based on selected answers

            break;
         }
         default: {
            console.warn(`Unhandled action: ${sAction}`);
         }
      }
   });

}

/** --------------------------------------------------------------------------- PAGE_Render
 * Render the poll results on the page using the loaded data
 */
function PAGE_RenderResult() {

   // ## Clear existing questions and answers ...................................
   const eQuestions = document.getElementById("idQuestions");
   eQuestions.innerHTML = "";

   // ## Load main TPoll record ..............................................
   const oPollTable = oDocument_g.GetTable("TPoll");
   if( !oPollTable ) { console.error("PAGE_Load stopped: TPoll failed to load"); return; }
   const oRecord = new DBRecordContainer(oPollTable.GetColumnInformation());
   const oPollData = oPollTable.AsObject(0);
   oRecord.AddValue(oPollData);
   oRecord.WriteValues(document.getElementById("idPoll"));

   // ## Load tags for poll .................................................
   const tableTag = oDocument_g.GetTable("TTag"); 
   if( tableTag && tableTag.GetRowCount() > 0 ) {
      const eTags = document.getElementById("idTags");                         // tag container element
      for( let i = 0; i < tableTag.GetRowCount(); i++ ) {
         const oRow = tableTag.AsObject(i);
         const eTag = document.createElement("span");
         eTag.className = "page-tag";
         eTag.textContent = oRow.FName;
         eTag.dataset.key = oRow.TagK;
         eTag.dataset.marked = "0";
         eTags.appendChild(eTag);
      }
   }

   // ## Calculate total vote count for poll .................................
   const iTotalCount = Number(oPollData.VoteCount) || 0; // Ensure VoteCount is defined for rendering
   oDocument_g.SetValue("TotalCount", iTotalCount); // Store vote count in document for later use in rendering   

   {  // ## Render all questions ...............................................
      const tablePollQuestion = oDocument_g.GetTable("TPollQuestion");
      const eQuestions = document.getElementById("idQuestions");
      const recordQuestion = new DBRecordContainer(tablePollQuestion.GetColumnInformation());

      for( let i = 0; i < tablePollQuestion.GetRowCount(); i++ ) {
         const oRow = tablePollQuestion.AsObject(i);
         recordQuestion.AddValue(oRow);

         // ### Geneate html for new question
         const eTemplate = document.getElementById("idTemplateQuestion").content.cloneNode(true).firstElementChild;
         recordQuestion.WriteValues(eTemplate);

         eQuestions.appendChild(eTemplate);
      }
   }

   {  // ## Render all answers for each question ..............................
      const tablePollAnswer = oDocument_g.GetTable("TPollAnswer");
      const recordAnswer = new DBRecordContainer(tablePollAnswer.GetColumnInformation());
      for( let i = 0; i < tablePollAnswer.GetRowCount(); i++ ) {
         const oRow = tablePollAnswer.AsObject(i);
         recordAnswer.AddValue(oRow);

         const sQuestionK = oRow.PollQuestionK; // key to question
         const eQuestion = document.querySelector(`[data-table="TPollQuestion"] [data-value="${sQuestionK}"]`); // select question bar to

         // ### Geneate html for new answer
         const eTemplate = document.getElementById("idTemplateAnswer").content.cloneNode(true).firstElementChild;

         /// ### Calculate vote percentage for this question based on total vote count, we can use this later to render a progress bar or similar visual representation of votes for this question
         const iVoteCount = Number(oRow.VoteCount) || 0; // get vote count for this answer
         const dVotePercentage = iTotalCount > 0 ? (iVoteCount / iTotalCount) * 100 : 0;
         const iVotePercentageRounded = Math.round(dVotePercentage);

         const eVoteCount = eTemplate.querySelector("[data-section='answer']");    // Select answer element to display vote count
         if( eVoteCount ) { eVoteCount.dataset.vote_count = `${iVoteCount}`; }

         const eBar = eTemplate.querySelector("[data-target='bar']");         // Select bar target and set witdth based on vote percentage
         eBar.style.width = `${dVotePercentage}%`;


         recordAnswer.WriteValues(eTemplate);
         const eVotePercentage = eTemplate.querySelector("[data-id='VotePercent']");
         if( eVotePercentage ) { eVotePercentage.textContent = `${iVotePercentageRounded}%`; }
         eQuestion.appendChild(eTemplate);
      }
   }
}

function PAGE_RenderFiltered() {
   // ## Clear existing filtered bars ........................................
   const eFilteredBars = document.querySelectorAll("[data-target='bar-filter']");
   eFilteredBars.forEach(eBar => eBar.style.width = "0%");

   // ## Clear existing filtered percentages ................................
   const eFilteredPercentages = document.querySelectorAll("[data-id='VotePercentFilter']");
   eFilteredPercentages.forEach(ePercent => ePercent.textContent = "");

   {
      const tableFiltered = oDocument_g.GetTable("TPollAnswer.Filtered");
      if( tableFiltered && tableFiltered.GetRowCount() > 0 ) {
         const iTotalCount = Number(oDocument_g.GetValue("TotalCount")) || 0; // Ensure VoteCount is defined for rendering
         for( let i = 0; i < tableFiltered.GetRowCount(); i++ ) {
            const oRow = tableFiltered.AsObject(i);                            // { PollAnswerK, VoteCount }

            const sQuestionK = oRow.PollQuestionK; // key to question

            // ## Find the answer element in the DOM that corresponds to this filtered answer
            const eAnswer = document.querySelector(`[data-table="TPollAnswer"] [data-value="${oRow.PollAnswerK}"]`);
            if( !eAnswer ) { console.warn(`No answer element found for PollAnswerK: ${oRow.PollAnswerK}`); continue; }

            const iVoteCount = Number(oRow.VoteCount) || 0; //
            const dVotePercentage = iTotalCount > 0 ? (iVoteCount / iTotalCount) * 100 : 0;

            const eBar = eAnswer.querySelector("[data-target='bar-filter']");         // Select bar target and set witdth based on vote percentage
            eBar.style.width = `${dVotePercentage}%`;
            // ## Set percent to data-id="VotePercentFilter"
            const eVotePercentFilter = eAnswer.querySelector("[data-id='VotePercentFilter']");
            if( eVotePercentFilter ) { eVotePercentFilter.textContent = `(${Math.round(dVotePercentage)}%)`; }
         }
      }
   }
}   
   </script>
</body>
</html>
