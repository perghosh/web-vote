<!--
@FILE [tag: result] [description: page for displaying poll results after voting] [name: page_cast_result.html]

Importanbt data attributes are data-action, data-section. These are both used for
command and simplify navigation in page.

PAGE_ Method documentation:
=========================

PAGE_Initialize - Initialize the page by creating necessary objects and loading initial data
PAGE_SetListeners - Set event listeners for user interactions on the page
PAGE_Load - Load poll information from the server and store it in the document
PAGE_Render - Render the poll results on the page using the loaded data

Queries used in page ==========================================================
#cast-poll - Fetch main poll information based on poll key
#cast-poll_questions - Fetch questions related to the poll
#cast-poll_answers_and_count - Fetch answers related to the poll along with their vote counts

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/variables/variables-color-default.css">
    <link rel="stylesheet" href="css/poll.css">
    <link rel="stylesheet" href="css/elements.css">
    <link rel="stylesheet" href="css/input-effects.css">
    <script src="js/gd_ui_toast.js"></script>
    <script src="js/gd_ui_tablelite.js"></script>
    <script src="js/gd_data_table.js"></script>
    <script src="js/gd_db.js"></script>
    <script src="js/gd_server.js"></script>
    <script src="js/document.js"></script>
    <title>Result and filter - Web Vote</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      .page-command { align-items: center; border: none; border-radius: 80px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); cursor: pointer; display: flex; font-family: inherit; font-size: 1.2rem; font-weight: 600; gap: 12px; justify-content: center; padding: 1rem 0; transition: all 0.2s ease; width: 100%; }
      @media (max-width: 640px) { .vote-answer-box { margin-top: 1px; } .vote-answer-option { align-items: flex-start; } }
      .page-bar { background: var(--chart-background, var(--color-border)); border-radius: 12px; height: 24px; overflow: hidden; position: relative; width: 100%; }
      .page-fill { background: var(--chart-primary, var(--background-success)); border-radius: 12px; height: 100%; position: relative; z-index: 1; }
      .page-fill-filter { background: var(--chart-secondary, var(--background-info)); border-radius: 999px; height: 50%; left: 0; position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; }

      .page-answer-block { padding-bottom: 16px; margin-bottom: 12px; }
      .page-answer-block:not(:last-child) { border-bottom: 1px solid var(--color-border); }

      .page-answer-row { align-items: center; column-gap: 14px; display: grid; grid-template-columns: 88px 1fr; }
      .page-answer-percentage { align-items: center; color: var(--chart-line, var(--color-active)); display: flex; font-size: 1.45rem; font-weight: 700; justify-content: flex-end; line-height: 1; min-height: 54px; }
      .page-answer-content { display: grid; gap: 8px; }
      .page-answer-content [data-field="FAnswer"] { margin-bottom: 0; }

      .page-count-marker { background: var(--chart-line, var(--background-primary)); border-radius: 999px; color: var(--color-primary); display: inline-flex; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; margin-left: 10px; padding: 4px 10px; text-transform: uppercase; vertical-align: middle; }
      .page-count-marker [data-field="VoteCount"] { margin-right: 4px; }
      @media (max-width: 640px) { .page-answer-row { grid-template-columns: 72px 1fr; } .page-answer-percentage { font-size: 1.2rem; } }
    </style>
</head>
<body>
   <!--
    | ## Page Container for poll result
    -->
   <div id="idPage" class="page-container container page" data-section="page">
      <!-- Poll information -->
      <div id="idPoll" class="container-view margin_b-small">
         <h1><span data-field="FName">Poll Title</span><span class="page-count-marker"><span data-field="VoteCount">0</span>votes</span></h1>
         <p data-field="FDescription">Poll description goes here...</p>
      </div>
      <!-- Questions and answers will be rendered here -->
      <div id="idQuestions" class="margin_b-small">
         <!-- Question and answer templates will be rendered here based on loaded data -->   
      </div>          
   </div>

   <!--
    | ## Poll question container
    -->
   <template id="idTemplateQuestion" data-description="question template">
      <div class="container-view margin_b-large" data-table="TPollQuestion">
         <div data-field="PollQuestionK" data-value="" data-table="TPollQuestion" data-description="key for question">
            <div data-section="record" data-table="TPollQuestion">
               <h3 class="margin_b-small" data-field="FName">Name...</h3>
               <p class="margin_b-small" data-field="FQuestion">Question text goes here...</p>
            </div>
            <div data-section="answer" class="margin_b-small">
               <!-- Answer options will be appended here based on answers linked to this question -->
            </div>
         </div>
      </div>
   </template>

   <!--
    | ## Poll answer container
    -->
   <template id="idTemplateAnswer" data-description="answer template">
      <div class="page-answer-block" data-table="TPollAnswer">
         <div data-field="PollAnswerK" data-value="" data-table="TPollAnswer" data-description="key for answer">
            <div data-section="record" data-table="TPollAnswer">
               <div class="page-answer-row">
                  <div class="page-answer-percentage" data-field="VotePercent">0%</div>
                  <div class="page-answer-content">
                     <p class="margin_b-small" data-field="FAnswer">Answer text goes here...</p>
                     <div class="page-bar" data-field="VoteCount" data-value="">
                        <div data-target="bar" class="page-fill" style="width: 50%;"></div>
                        <div data-target="bar-filter" class="page-fill-filter"></div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </template>



<script>
'use strict';

let oDocument_g; // Global document object
let oToast_g;

// ## Prepare base url .....................................................
const sBaseUrl_g = gd.GetBaseUrl();
gd.SetBaseUrl(sBaseUrl_g);

// ## Initialize the page
document.addEventListener('DOMContentLoaded', function() {
   THEME_Select("color", {});
   PAGE_Initialize();
   //PAGE_SetListeners();
});

/** --------------------------------------------------------------------------- PAGE_Initialize
 * Initialize the page by creating necessary objects and loading initial data
 */
function PAGE_Initialize() {
   oDocument_g = new CDocument({});                                           // Create new document
   oToast_g = new UIToast(document.body, { sPosition: "top-right", iDuration: 3000 });

   let sPollK = null; // Get poll key from url parameters if available, otherwise use null to fetch first poll

   // try to get poll key from url parameters, if not available use null to fetch first poll
   const oUrlParameter = new URLSearchParams(window.location.search);
   sPollK = oUrlParameter.get("PollK") || oUrlParameter.get("key") || null;
   if( !sPollK || sPollK.length !== 32 ) { console.warn("No poll key or invalid poll key provided in URL parameters, fetching first poll");
      sPollK = null;                                                           // Set to null to fetch first poll
   }
   else { oDocument_g.SetValue("PollK", sPollK); }                            // Store poll key in document for later use

   if( sPollK ) {
      PAGE_Load();                                                            // Load poll information and display it on the page
   }
}

/** --------------------------------------------------------------------------- PAGE_Load
 * Load poll information from the server and store it in the document
 */
async function PAGE_Load() {
   const sPollK = oDocument_g.GetValue("PollK");                              // Get poll key from document
   const aColumn = ["TPoll","PollK", sPollK ];                                // table, column and value to fetch poll information

   // ## Fetch poll information ...............................................

   const fnLoadTable = async (sQueryName, sTableName) => {
      try {
         const oResult = await gd.Send("!db/select?", { query: `#${sQueryName}`, columns: JSON.stringify(aColumn) });
         const eResult = oResult?.data?.querySelector("result");
         if( !eResult ) {
            console.error("No result element found in response for query:", sQueryName, "Response data:", oResult?.data);
            return null;
         }

         if( !eResult.textContent ) { console.error("No data found in result for query:", sQueryName, "Result element:", eResult); return null; }

         const aResult = JSON.parse(eResult.textContent);
         const oTable = new Table(aResult);
         oTable.name = sTableName;
         oTable.SetProperty("query", sQueryName);
         oDocument_g.AddTable(oTable);
         return oTable;
      }
      catch( e_ ) { console.error("Failed to load table for query:", sQueryName, e_); return null;}
   };

   // ## Load main TPoll record ..............................................
   const oPollTable = await fnLoadTable("cast-poll", "TPoll");
   if( !oPollTable ) { console.error("PAGE_Load stopped: TPoll failed to load"); return; }
   const oRecord = new DBRecordContainer(oPollTable.GetColumnInformation());
   const oPollData = oPollTable.AsObject(0);
   oRecord.AddValue(oPollData);
   oRecord.WriteValues(document.getElementById("idPoll")); 

   const iTotalCount = Number(oPollData.VoteCount) || 0; // Ensure VoteCount is defined for rendering
   oDocument_g.SetValue("TotalCount", iTotalCount); // Store vote count in document for later use in rendering

   // ## Load related tables for questions, answers and votes ................
   const oPollQuestionTable = await fnLoadTable("cast-poll_questions", "TPollQuestion");
   if( !oPollQuestionTable ) { console.error("PAGE_Load stopped: TPollQuestion failed to load"); return; }

   const oPollAnswerTable = await fnLoadTable("cast-poll_answers_and_count", "TPollAnswer");
   if( !oPollAnswerTable ) { console.error("PAGE_Load stopped: TPollAnswer failed to load"); return; }

   /*
   const oPollVoteTable = await fnLoadTable("cast-poll_votes", "TPollVote");
   if( !oPollVoteTable ) { console.error("PAGE_Load stopped: TPollVote failed to load"); return; }
   */

   PAGE_RenderResult();                                                             // Render the page with loaded data
}

/** --------------------------------------------------------------------------- PAGE_Render
 * Render the poll results on the page using the loaded data
 */
function PAGE_RenderResult() {
   const iTotalCount = oDocument_g.GetValue("TotalCount");                      // Total vote count

   {  // ## Render all questions ...............................................
      const tablePollQuestion = oDocument_g.GetTable("TPollQuestion");
      const eQuestions = document.getElementById("idQuestions");
      const recordQuestion = new DBRecordContainer(tablePollQuestion.GetColumnInformation());

      for( let i = 0; i < tablePollQuestion.GetRowCount(); i++ ) {
         const oRow = tablePollQuestion.AsObject(i);
         recordQuestion.AddValue(oRow);

         // ### Geneate html for new question
         const eTemplate = document.getElementById("idTemplateQuestion").content.cloneNode(true).firstElementChild;
         recordQuestion.WriteValues(eTemplate);

         eQuestions.appendChild(eTemplate);
      }
   }

   {  // ## Render all answers for each question ..............................
      const tablePollAnswer = oDocument_g.GetTable("TPollAnswer");
      const recordAnswer = new DBRecordContainer(tablePollAnswer.GetColumnInformation());
      for( let i = 0; i < tablePollAnswer.GetRowCount(); i++ ) {
         const oRow = tablePollAnswer.AsObject(i);
         recordAnswer.AddValue(oRow);

         const sQuestionK = oRow.PollQuestionK; // key to question
         const eQuestion = document.querySelector(`[data-table="TPollQuestion"] [data-value="${sQuestionK}"]`); // select question bar to

         // ### Geneate html for new answer
         const eTemplate = document.getElementById("idTemplateAnswer").content.cloneNode(true).firstElementChild;

         /// ### Calculate vote percentage for this question based on total vote count, we can use this later to render a progress bar or similar visual representation of votes for this question
         const iVoteCount = Number(oRow.VoteCount) || 0; //
         const dVotePercentage = iTotalCount > 0 ? (iVoteCount / iTotalCount) * 100 : 0;
         const iVotePercentageRounded = Math.round(dVotePercentage);

         const eBar = eTemplate.querySelector("[data-target='bar']");         // Select bar target and set witdth based on vote percentage
         eBar.style.width = `${dVotePercentage}%`;

         recordAnswer.WriteValues(eTemplate);
         const eVotePercentage = eTemplate.querySelector("[data-field='VotePercent']");
         if( eVotePercentage ) { eVotePercentage.textContent = `${iVotePercentageRounded}%`; }
         eQuestion.appendChild(eTemplate);
      }
   }
}
   </script>
</body>
</html>
