<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/variables-purple-soft.css">
    <link rel="stylesheet" href="css/poll.css">
    <link rel="stylesheet" href="css/elements.css">
    <link rel="stylesheet" href="css/input-effects.css">
    <script src="js/gd_ui_toast.js"></script>
    <script src="js/gd_ui_tablelite.js"></script>
    <script src="js/gd_data_table.js"></script>
    <script src="js/gd_db.js"></script>
    <script src="js/gd_browser.js"></script>
    <script src="js/document.js"></script>
    <title>Login - Web Vote</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
    </style>
</head>
<body>
   <!--
    | ## Page Container for casting votes
    -->
   <div id="idPage" class="page-container container page" data-section="page">

   </div>
   <template id="idTemplatePoll" data-description="template for generating poll information">
   </template>

   <template id="idTemplateQuestion" data-description="template for generating question information based on possible questions added to poll">
   </template>

   <template id="idTemplateAnswer" data-description="template for generating answer information based on possible answers added to question"> 
   </template>


   <script>
'use strict';

let oDocument_g; // Global document object
let oToast_g;

// ## Prepare base url .....................................................
const sBaseUrl = gd.GetBaseUrl();
gd.SetBaseUrl(sBaseUrl);

const sBaseUrl_g = gd.GetBaseUrl();
gd.SetBaseUrl(sBaseUrl_g);

// ## Initialize the page
document.addEventListener('DOMContentLoaded', function() {
   PAGE_Initialize();
   PAGE_SetListeners();
});

function PAGE_Initialize() {
   oDocument_g = new CDocument({});                                           // Create new document
   oToast_g = new UIToast(document.body, { sPosition: "top-right", iDuration: 3000 });

   let sPollKey = null; // Get poll key from url parameters if available, otherwise use null to fetch first poll

   // try to get poll key from url parameters, if not available use null to fetch first poll
   const oUrlParameter = new URLSearchParams(window.location.search);
   sPollKey = oUrlParameter.get("PollK") || oUrlParameter.get("key") || null;
   if( !sPollKey || sPollKey.length !== 32 ) {
      console.warn("No poll key or invalid poll key provided in URL parameters, fetching first poll");
      sPollKey = null; // Set to null to fetch first poll
   }
}   
 
   </script>
</body>
</html>
