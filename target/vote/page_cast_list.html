<!--
PAGE_ Method Documentation:
=========================
PAGE_Initialize - Initialize the page
PAGE_OnIdle - Handles idle state by updating UI elements and checking for changes
PAGE_Render -  Render the page, update UI elements based on current document state
PAGE_SetListeners - Configure page listeners, handle page specific events  
PAGE_ProcessResponse - Handle response data from server and display it in the container

PollList.Render - Render the poll list based on current document state
PollList.LoadSearchValues - Load options for advanced Area filter dropdown in search panel
PollList.GetResult - Update Poll result based on options, options can include filters, sorting and pagination parameters

Objects:
CDocument - Manages data and state of the page, including records and tables
DBRecord - Represents a database record, with methods to read/write values and get arguments for server
UITableLite - A lightweight table UI component for displaying data in a table format

<method name> - <description>
-->

<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="css/variables/variables-color-default.css">
   <link rel="stylesheet" href="css/poll.css">
   <link rel="stylesheet" href="css/elements.css">
   <link rel="stylesheet" href="css/input-effects.css">
   <script src="js/gd_server.js"></script>
   <script src="js/gd_ui_toast.js"></script>
   <script src="js/gd_ui_tablelite.js"></script>
   <script src="js/gd_db.js"></script>
   <script src="js/gd_data_table.js"></script>
   <script src="js/document.js"></script>
   <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      .page-title { color: var(--color-body); }


      .container-result { margin-top: 10px; overflow-x: auto; /*max-height: 200px;*/ overflow-y: auto;}
      .container-result:not(:empty) { margin-bottom: 20px; }
      .container-result table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
      .container-result tbody tr { border-bottom: 1px solid var(--color-border); transition: background-color 0.3s ease;}
      .container-result tbody tr:hover { background: var(--background-light-hover); }
      .container-result td { cursor: pointer; padding: 20px 22px; color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
      .container-result th { padding: 6px 8px; text-align: left; font-weight: 600; color: var(--color-body); border-bottom: 2px solid var(--color-border); }
      .container-result thead { background: var(--background-light); position: sticky; top: 0; z-index: 1; }

      button.button { border: none; }
      .divider { border-radius: 5px; border-top: 2px solid var(--color-border); }
      .group { align-items: flex-end; display: flex; gap: 12px; }
      .search-group { align-items: stretch; display: block; }
      .label-number { color: var(--background-success); }
      .label-text { color: var(--color-muted); text-align: right;}
      .row { display: flex; width: 100%; flex-wrap: wrap;}

      /* select */
      .filter { padding: 10px 12px; border: 1px solid var(--color-border); border-radius: 5px; background: var(--background-light); color: var(--color-body); transition: all 0.2s ease;}
      .filter:hover { background: var(--background-light-hover); }

      .advanced-search { border-top: 1px solid var(--color-border); display: none; margin-top: 10px; padding-top: 10px; width: 100%; }
      .advanced-search[data-visible="true"] { display: block; }
      .advanced-search-row { align-items: center; display: flex; gap: 10px; }
      .advanced-search-label { color: var(--color-muted); font-size: 12px; min-width: 80px; }
      .advanced-search-select { max-width: 220px; min-width: 160px; }

      @media (max-width: 768px) { .label-text { display: none; } .filter { width: 70px; } }

      /* poll row */
      .poll-row { align-items: center; border: 1px solid var(--color-border); border-radius: 10px; background: var(--background-light); cursor: pointer; display: flex; gap: 12px; margin-bottom: 10px; padding: 8px 18px; transition: all 0.2s ease; }
      .poll-row:hover { background: var(--background-light-hover); transform: translateY(-1px); }
      .poll-content { flex: 1; min-width: 0; }
      .poll-row [data-id='idName'] { color: var(--color-body); font-weight: 600; }
      .poll-row [data-id='idDescription'] { color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .poll-row [data-id='idVotes'] { color: var(--background-success); font-size: 30px; font-weight: 600; max-width: 200px; text-align: center; }


      .container-form {height: 100%;}
   </style>
</head>
<body>
   <div id="idContainer" class="page-container container page" data-section="page">
      <form id="idFormSearch" class="container-form margin_b-small" onsubmit="event.preventDefault();"
         style="margin-top: 10px;">
         <div class="title" style="margin-bottom: 20px;">
            <h2 class="page-title">Sök och filtrera omröstningar</h2>
         </div>
   
         <div data-section="search" class="group search-group">
            <div class="row">
               <div style="flex: 1;">
                  <label class="floating">
                     <input type="text" placeholder=" " id="idSearchInput" data-id="search">
                     <span>Sök</span>
                  </label>
               </div>
   
               <label class="label-text">Sortera efter:</label>
   
               <select class="filter" data-action="sort">
                  <!-- <option value="votes">Most Votes</option> -->
                  <option value="ascending" selected>A-Z</option>
                  <option value="descending">Z-A</option>
               </select>
               <button class="button" data-action="search" style="margin-left: 10px;">Sök</button>
               <button class="button" data-action="search-advanced" style="margin-left: 10px;">Mer...</button>
            </div>

            <div id="idSearchAdvanced" class="advanced-search" data-visible="false">
               <div class="advanced-search-row">
                  <label class="advanced-search-label" for="idSearchArea">Område:</label>
                  <select id="idSearchArea" class="filter advanced-search-select" data-id="area">
                     <option value="">Alla</option>
                  </select>
               </div>
            </div>
         </div>
   
         <div data-section="select-polls" class="container-result"></div>
      </form>
   </div>

   <template id="idTemplateRow">
      <div class="poll-row">
         <div class="poll-votes" data-id="idVotes">0</div>
         <div class="poll-content">
            <div class="poll-name" data-id="idName">Name</div>
            <div class="poll-header" data-id="idDescription">Description</div>
         </div>
         <a href="#" data-action="vote" style="margin-left: auto; padding: 8px 12px; border-radius: 50px; background: var(--background-success); color: var(--color-success); font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-decoration: none; white-space: nowrap; align-self: center;">Rösta</a>
      </div>
   </template>
   

   <script>

   let oToast_g;
   let oDocument_g;

   // Start page initialization -----------------------------------------------
   document.addEventListener('DOMContentLoaded', function() {
      THEME_Select("color", {});
      PAGE_Initialize();                                                      // Initialize page
      PAGE_SetListeners();
   });



   /** --------------------------------------------------------------------- @API [tag: initialize]
    * Main initialization function that initializes the page
    */
   function PAGE_Initialize() {
      oDocument_g = new CDocument({});
      
      let oTable = new Table(["id", "Name", "Description", "Votes"], {sName: "search"} );
      oDocument_g.AddTable(oTable);

      // ## Read arguments from url and set to document
      const oUrlParameter = new URLSearchParams(window.location.search);
      const sArea = oUrlParameter.get("area") || null;
      if(sArea && !isNaN(parseInt(sArea))) {                                  // check if area is a valid number
         oDocument_g.SetValue("area", parseInt(sArea, 10));
         localStorage.setItem("area", sArea);
      }
      else {
         const sArea = localStorage.getItem("area");
         if(sArea && !isNaN(parseInt(sArea))) { oDocument_g.SetValue("area", parseInt(sArea, 10)); }
      }

      PollList.LoadSearchValues();
      PollList.GetResult();

      oToast_g = new UIToast(document.body, { sPosition: 'top-right', iDuration: 3000 });
   }


   /** ---------------------------------------------------------------------------
    * Update UI elements
    */
   function PAGE_Render() {
      PollList.Render();
   }



   /** --------------------------------------------------------------------- @API [tag: event, command]
   * Configure page listeners, handle page specific events
   */
   function PAGE_SetListeners() {
      const eContainer = document.querySelector("#idContainer");

      eContainer.addEventListener("click", (e_) => {
         const eTarget = e_.target;
         const sAction = eTarget.dataset.action;

         // redirect user to result
         const eRow = eTarget.closest(".poll-row");

         if(eRow && eRow.dataset.key)
         {
            e_.stopPropagation();
            const sPollK = eRow.dataset.key;

            if( sAction === "vote" )
            {
               window.location.href = `page_cast.html?key=${encodeURIComponent(sPollK)}`;
               return;
            }


            window.location.href = `page_cast_result.html?key=${encodeURIComponent(sPollK)}`;
            return;
         }


         if(!eTarget.dataset.action) return;
         e_.stopPropagation();

         switch(sAction) {
            case "sort": {
               console.log("Sort action triggered");

               if( eTarget.value === "votes" ) { PollList.GetResult( {"order": [-3]} );}
               else if( eTarget.value === "ascending" ) { PollList.GetResult( {"order": [2]} ); }
               else if( eTarget.value === "descending" ) { PollList.GetResult( {"order": [-2]} ); }
               else { return; }
            } break;
            case "search-advanced": {
               const eAdvancedSearch = eContainer.querySelector("#idSearchAdvanced");
               if(!eAdvancedSearch) { return; }

               const bVisible = eAdvancedSearch.dataset.visible === "true";
               eAdvancedSearch.dataset.visible = bVisible ? "false" : "true";
            } break;
            case "search": {
               const sSearchValue = eContainer.querySelector('[data-id="search"]').value;
               const sArea = eContainer.querySelector('[data-id="area"]').value;
               oDocument_g.SetValue("search", sSearchValue);

               if(sArea === "") { oDocument_g.SetValue("area", null); localStorage.removeItem("area"); }
               else if(!isNaN(parseInt(sArea, 10))) {
                  oDocument_g.SetValue("area", parseInt(sArea, 10));
                  localStorage.setItem("area", sArea);
               }

               PollList.GetResult();
            } break;
            default:
               console.error("Unknown action:", sAction);
         }

      });

      // ## Area select change listener - trigger search on area change ......
      const eAreaSelect = eContainer.querySelector('[data-id="area"]');
      if(eAreaSelect) {
         eAreaSelect.addEventListener("change", (e_) => {
            const sArea = e_.target.value;

            if(sArea === "") { oDocument_g.SetValue("area", null); localStorage.removeItem("area"); }
            else if(!isNaN(parseInt(sArea, 10))) {
               oDocument_g.SetValue("area", parseInt(sArea, 10));
               localStorage.setItem("area", sArea);
            }

            PollList.GetResult();
         });
      }

   }

   /** -----------------------------------------------------------------------
    * Handle response data from server and display it in the container
    *
    * Response data format is { type: <format>, data: <data> } and type can be any of
    * json, xml or text. "type" is the format of the data, e.g. "json", "xml", "text"
    *
    * @param {object} oData - The response data to process, format is { type: <format>, data: <data> }
    */
   function PAGE_ProcessResponse(oData, sOperation) {
      let sResult = '';
      let eResults = null;

      switch(oData.type) {
         case 'json':
            sResult = JSON.stringify(oData.data, null, 2);
            break;
         case 'xml':

            // If oData.data is an XML Document object, serialize it to string
            if (oData.data instanceof XMLDocument || oData.data.nodeType === 9) {
               //sResult = (new XMLSerializer()).serializeToString(oData.data);

               // ## query results element
               eResults = oData.data.querySelector('results');                   // get results element holding result elements
            } else {
               // If it's already a string, use it directly
               sResult = oData.data;
            }

            break;
         case 'text':
            sResult = oData.data;
            break;
         default:
            console.error("Unknown response type:", oData.type);
      }
      

      if(eResults)
      {
         if( sOperation === "select-polls")
         {
            const eSelect = eResults.querySelector('result[command="select"]');
            const aPoll = JSON.parse(eSelect.textContent);
            aPoll.shift();

            let oTable = oDocument_g.GetTable("search");
            if(!oTable)
            {
               oTable = new Table(["id", "Name", "Description", "Votes"], {sName: "search"} );
               oDocument_g.AddTable(oTable);
            }
            else { oTable.Clear(); }

            // loop array and add rows to table
            for(const aRow of aPoll) {oTable.Add(aRow);}

            PAGE_Render();
         }
      }
   }


   const PollList = {
      /** ---------------------------------------------------------------------------
       * Update UI elements
       */
      Render() {
         const oTable = oDocument_g.GetTable("search");
         if (!oTable) return;

         const eSelectPoll = document.getElementById("idContainer").querySelector('[data-section="select-polls"]');
         eSelectPoll.innerHTML = "";

         const eTemplate = document.getElementById("idTemplateRow");

         for(let i = 0; i < oTable.GetRowCount(); i++)
         {
            const eRow = eTemplate.content.cloneNode(true).firstElementChild;

            const sKey = oTable.GetCell(i, 0);
            const sName = oTable.GetCell(i, 1);
            const sHeader = oTable.GetCell(i, 2);
            const sVotes = oTable.GetCell(i, 3);

            eRow.dataset.key = sKey;

            eRow.querySelector("[data-id='idName']").textContent = sName;
            eRow.querySelector("[data-id='idDescription']").textContent = sHeader;
            eRow.querySelector("[data-id='idVotes']").textContent = sVotes;

            eSelectPoll.appendChild(eRow);
         }
      },

      /** ----------------------------------------------------------------------- @API [tag: search, load]
       * Load options for advanced Area filter dropdown in search panel
       */
      LoadSearchValues() {
         const eSearchArea = document.getElementById("idSearchArea");
         if(!eSearchArea) { return; }

         gd.Send("!db/select?", { query: "#code-get_list", values: JSON.stringify({ "TCode.CodeGroupK": 10601 }) }).then(function(oResult) {
            const eResult = oResult?.data?.querySelector("result");
            if(!eResult || !eResult.textContent) { return; }

            const aResult = JSON.parse(eResult.textContent);                   // parse result as array
            if(Array.isArray(aResult) && aResult.length > 0) { aResult.shift(); } // remove first row that is the column names

            for(let i = 0; i < aResult.length; i++)
            {
               const aRow = aResult[i];
               if(!Array.isArray(aRow) || aRow.length < 2) { continue; }

               const sValue = String(aRow[0] ?? "");
               const sText = String(aRow[1] ?? "");
               if(sValue === "" || sText === "") { continue; }

               const eOption = document.createElement("option");
               eOption.value = sValue;
               eOption.textContent = sText;
               eSearchArea.appendChild(eOption);
            }

            // ## set selected area if it exists in options ......................
            const iArea = oDocument_g.GetValue("area");
            if(iArea !== undefined && iArea !== null) {
               const sArea = String(iArea);
               if(eSearchArea.querySelector(`option[value="${sArea}"]`)) { eSearchArea.value = sArea; } // select option if it exists
            }
         });
      },

      /** --------------------------------------------------------------------- @API [tag: result, poll]
       * Update Poll result based on options, options can include filters, sorting and pagination parameters
       */
      GetResult(options_) {
         const oModifiers = { table: "TPoll", order: [2], "limit": [0, 20] };

         if( typeof options_ === "object" )
         {
            // merge options_ into oModifiers
            for(const sKey in options_) { oModifiers[sKey] = options_[sKey]; }
         }

         oDocument_g.MergeValue( "modifiers", oModifiers );                   // merge to keep old values, only update changed values

         let oArguments = { query: "#list-poll", modifiers: JSON.stringify(oModifiers) };
         let oValues = {};
         const iArea = oDocument_g.GetValue("area");
         if(iArea) { oValues["area"] = iArea; }
         const sSearch = oDocument_g.GetValue("search");
         if(sSearch) { oValues["search"] = sSearch; }

         //oValues["__expression"] = "date-created.last_7_days";                 // default filter to only show polls created in the last 7 days, this is done by adding a fixed condition to the query using expressions defined in vote-expressions.xml

         // ## Add oValues if not empty
         if(Object.keys(oValues).length > 0) { oArguments.values = JSON.stringify(oValues); }

         gd.Send("!db/select?", oArguments).then(function(oResult) {
            PAGE_ProcessResponse(oResult, "select-polls");
         });
      }
   };


   </script>
</body>
</html>
