<!--
PAGE_ Method Documentation:
=========================
PAGE_Initialize - Initialize the page
PAGE_OnIdle - Handles idle state by updating UI elements and checking for changes
PAGE_Update -  Update UI elements based on the given type
PAGE_SetListeners - Configure page listeners, handle page specific events  
PAGE_ProcessResponse - Handle response data from server and display it in the container

Objects:
CDocument - Manages data and state of the page, including records and tables
DBRecord - Represents a database record, with methods to read/write values and get arguments for server
UITableLite - A lightweight table UI component for displaying data in a table format

<method name> - <description>
-->

<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="css/variables/variables-color-default.css">
   <link rel="stylesheet" href="css/poll.css">
   <link rel="stylesheet" href="css/elements.css">
   <link rel="stylesheet" href="css/input-effects.css">
   <script src="js/gd_server.js"></script>
   <script src="js/gd_ui_toast.js"></script>
   <script src="js/gd_ui_tablelite.js"></script>
   <script src="js/gd_db.js"></script>
   <script src="js/gd_data_table.js"></script>
   <script src="js/document.js"></script>
   <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      .page-title { color: var(--color-body); }


      .container-result { margin-top: 10px; overflow-x: auto; max-height: 200px; overflow-y: auto; }
      .container-result:not(:empty) { margin-bottom: 20px; }
      .container-result table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
      .container-result tbody tr { border-bottom: 1px solid var(--color-border); }
      .container-result tbody tr:hover { background: var(--background-light-hover); }
      .container-result td { cursor: pointer; padding: 5px 8px; color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .container-result th { padding: 6px 8px; text-align: left; font-weight: 600; color: var(--color-body); border-bottom: 2px solid var(--color-border); }
      .container-result thead { background: var(--background-light); position: sticky; top: 0; z-index: 1; }

      button.button { border: none; }
      .divider { border-radius: 5px; border-top: 2px solid var(--color-border); }
      .group { align-items: flex-end; display: flex; gap: 12px; }
      .label-number { color: var(--background-success); }
      .label-text { color: var(--color-muted); }
      .row { display: flex; width: 100%; }
   </style>
</head>
<body>
   <div id="idContainer" class="page-container container page" data-section="page">



      <form id="idForm" class="container-form margin_b-small" onsubmit="event.preventDefault();"">

        <div class="title" style="margin-bottom: 20px;"><h2 class="page-title">Edit Poll Details</h2></div>

         <div data-section="poll-form">
            <div class="group" style="gap: 20px;">
               <div style="flex: 1">
                  <label class="floating">
                     <input type="text" placeholder=" " data-field="FName">
                     <span>Name</span>
                  </label>
               </div>

               <div style="flex: 1">
                  <label class="floating">
                     <input type="text" placeholder=" " data-field="FHeader">
                     <span>Header</span>
                  </label>
               </div>
            </div>

            <!--<div class="group" style="margin-top: 20px; width: 50%;">

               
            </div>-->

            <div class="group" style="margin-top: 20px;">
               <label class="floating" style="width: 100%;">
                  <textarea placeholder=" " data-field="FDescription"></textarea>
                  <span>Description</span>
               </label>
            </div>
         </div>

         <div class="group" id="idFieldLabels" style="gap: 20px;">
            <div class="row" style="flex: 1; margin-top: 20px;">
               <label class="label-text" style="visibility: collapse; width: 100%;" data-field="question">Questions:</label>
               
               
               <label class="label-text" style="visibility: collapse; width: 100%;" data-field="answer">Answers:</label>
               
            </div>
         </div>

         <hr class="divider" style="margin-top: 20px">
         
         <div class="row" id="idButtons" style="margin-top: 20px;" data-section="command">
            <button class="button" data-action="poll-add" data-table="TPoll">Add</button>
            <button class="button" style="visibility: hidden;" data-action="poll-update" data-table="TPoll" data-idle="poll_key">Update</button>
            <button class="button" style="visibility: hidden;" data-action="poll-delete" data-table="TPoll" data-idle="poll_key">Delete</button>
            <!-- align to right -->
         </div>
         <div class="row" style="justify-content: flex-end; flex: 1;">
            <button class="button" style="visibility: hidden;" data-action="poll-open" data-table="TPoll" data-idle="poll_key">Edit poll ...</button>
            <button class="button" style="visibility: hidden;" data-action="poll-cast" data-table="TPoll" data-idle="poll_key">Casting ...</button>
            <button class="button" style="visibility: hidden;" data-action="poll-result" data-table="TPoll" data-idle="poll_key">Result ...</button>
         </div>

      </form>

    <form id="idFormSearch" class="container-form margin_b-small" onsubmit="event.preventDefault();" style="margin-top: 10px;">

        <div class="title" style="margin-bottom: 20px;"><h2 class="page-title">Search Polls</h2></div>

        <div data-section="search" class="group">
            <div class="row">
                  <div style="flex: 1;">
                    <label class="floating">
                        <input type="text" placeholder=" " id="idSearchInput" data-field-type="search">
                        <span>Search</span>
                    </label>
                  </div>
                  <button class="button" data-action="search" style="margin-left: 10px;">Search</button>
            </div>
         </div>

        <div data-section="select-polls" class="container-result"></div>
    </form>

   </div>

   

   <script>

   let oToast_g;
   let oDocument_g;

   function CreateButtons(eParent)
   {
      
      /*PAGE_DeleteButtons(eParent);

      const eButtonUpdate = document.createElement("button");
      eButtonUpdate.className = "button";
      eButtonUpdate.dataset.action = "update";
      eButtonUpdate.innerHTML = "Update";

      const eButtonDelete = document.createElement("button");
      eButtonDelete.className = "button";
      eButtonDelete.dataset.action = "delete";
      eButtonDelete.innerHTML = "Delete";

      eParent.appendChild(eButtonUpdate);
      eParent.appendChild(eButtonDelete);
      */
   }

   /** ------------------------------------------------------------------------
    * Clears all form input fields within the given parent element
    */
   function PAGE_DeleteFieldInputs(eParent)
   {
      const aFields = eParent.querySelectorAll("[data-field]");

      aFields.forEach((eField) => { eField.value = ""; });
   }

   /** ------------------------------------------------------------------------
    * Removes action buttons except the "add" button from the button row
    */
   function PAGE_DeleteButtons(eParent)
   {
      const aButtons = eParent.querySelectorAll("#idButtons button");

      aButtons.forEach((eButton) => {
         if(eButton.dataset.action !== "add")
         {
            eButton.remove();
         }
      });
   }

   function PAGE_UpdateFieldLabels(eParent)
   {
      const aFields = eParent.querySelectorAll("[data-field]"); 

      const sKey = oDocument_g.key_;
      const sQueryName = "vote-count_questions";
      const sArguments = "query=#" + sQueryName + "\n" + `values=${JSON.stringify({ PollK: sKey })}`;

      gd.SendToServer("", "!db/select?echo=user", sArguments).then(function(oResult)
      {
         const aResult = JSON.parse( oResult.data.querySelector("result").textContent );
         console.log(aResult);

         const iQuestionCount = aResult[1]; //?? 0;

         aFields.forEach((eField) => {
            const sField = eField.dataset.field;
            if(sField == "question")
            {
                 eField.innerHTML = `Questions: ${iQuestionCount}`;
                 eField.style.visibility = "visible";
            }
            else if(sField == "text")
            {
                 eField.style.visibility = "visible"; 
            }
         });
      });

   }

   function PAGE_TableUpdate() {
      const sQueryName = "vote-poll_search";
      gd.SendToServer("", "!db/select", "query=#" + sQueryName).then(function(oResult) {
         PAGE_ProcessResponse(oResult, "select-polls");
      });
   }

   // Start page initialization -----------------------------------------------
   document.addEventListener('DOMContentLoaded', function() {
      THEME_Select("color", {});
      PAGE_Initialize();                                                      // Initialize page
   });

   const aEditField = [
      { field: "PollK", type: "string", key: true},
      { label: "Name", description: "Name for poll in system", field: "FName", type: "string", required: true},
      { label: "Header", description: "Header for poll in system", field: "FHeader", type: "string", required: true},
      { label: "Description", description: "Description for poll in system", field: "FDescription", type: "string", required: true},
   ]

   /** --------------------------------------------------------------------- @API [tag: initialize]
    * Main initialization function that initializes the page
    */
   function PAGE_Initialize() {
      oDocument_g = new CDocument({});
      
      let oTable = new Table(["id", "name", "header"], {sName: "search"} );
      oDocument_g.AddTable(oTable);

      PAGE_TableUpdate();

      const fnRead = function(sName, oRecord)
      {
         const ePollform = document.querySelector('#idForm div[data-section="poll-form"]');
         const eField = ePollform.querySelector(`[data-field="${sName}"]`);
         if( eField ) { this.SetValue(sName, eField.value); }
      };

      const fnWrite = function(sName, oRecord)
      {
         const ePollform = document.querySelector('#idForm div[data-section="poll-form"]');
         const eField = ePollform.querySelector(`[data-field="${sName}"]`);
         if( eField ) { eField.value = this.GetValue(sName); }
      };

      let oRecord = new DBRecord([], { fnRead, fnWrite });
      oRecord.table = "TPoll";
      console.log(oRecord);

      // Adds fields from `aEditField` to record
      oRecord.AddColumn(aEditField, {sLabel: "label", sDescription: "description", sName: "field", sType: "type", bKey: "key"})
      oDocument_g.AddRecord(oRecord);                                          // add record to document

      oToast_g = new UIToast(document.body, { sPosition: 'top-right', iDuration: 3000 });

      // ## Start idle timer - call PAGE_OnIdle() once per second
      //CDocument.iIdleTimerId_s = setInterval(PAGE_OnIdle, 1000);

      PAGE_SetListeners();
   }


   /** ---------------------------------------------------------------------------
    * Update UI elements
    */
   function PAGE_Update( sType ) {
      if( sType === undefined || sType === "search" )
      {
         const oTable = oDocument_g.GetTable("search");
         if(oTable)
         {
            const eSelectPoll = document.getElementById("idContainer").querySelector('[data-section="select-polls"]');
            eSelectPoll.innerHTML = "";

            const fnSelectPoll = (sEvent, oParameter) => {
               if(sEvent === "row")
               {
                  const iRow = oParameter.iOriginalIndex;
                  const eRow = oParameter.eRow;
                  const sKey = oTable.GetCell(iRow, 0);
                  eRow.dataset.key = sKey;
               }
            };

            const oUITable = new UITableLite( eSelectPoll, oTable, { iSort: 0, aColumns: [1,2], bHeader: true, bIndices: true, callback: fnSelectPoll} );
            oUITable.Render();
         }
      }

      const oDBRecordPoll = oDocument_g.GetRecord("TPoll");
      const bPollHasKey = oDBRecordPoll.HasKeyValue();

      const ePoll = document.getElementById("idForm");
      const aPollButtons = ePoll.querySelectorAll("[data-idle='poll_key']");

      const sVisibility = bPollHasKey === true ? "visible" : "hidden";
      aPollButtons.forEach( eButton => { eButton.style.visibility = sVisibility; });
   }

    /** --------------------------------------------------------------------- @API [tag: onidle]
     * Handles idle state by updating UI elements and checking for changes
     */
   const PAGE_OnIdle = (function() {
      var bLastModified = false;

      return function() {
         const bModified = oDocument_g.IsModified();

         if( bModified !== bLastModified ) {

            // TODO: Update UI elements based on modified status

            bLastModified = bModified;
         }
      }
   })();

   /** --------------------------------------------------------------------- @API [tag: event, command]
   * Configure page listeners, handle page specific events
   */
   function PAGE_SetListeners() {
      const eContainer = document.querySelector("#idContainer");

      eContainer.addEventListener("click", (e_) => {
         const eTarget = e_.target;

         if( eTarget.tagName === "TD" && eTarget.parentNode.dataset.key)
         {
            e_.stopPropagation();
            const sKey = eTarget.parentNode.dataset.key;
            //const sSelect = "SELECT PollK, FName, FHeader, FDescription FROM TPoll WHERE PollK = x{PollK}";
            const sQueryName = "vote-poll_table";
            const sArguments = "query=#" + sQueryName + "\n" + `values=${JSON.stringify({ PollK: sKey })}`;

            gd.SendToServer("", "!db/select?echo=user", sArguments).then(function(oResult)
            {
               const oData = oResult.data;
               //const aPollResult = JSON.parse( oData.querySelector("result").textContent );
               const aPollResult = JSON.parse( oData.querySelector("result").childNodes[0].nodeValue );
               const oDBRecord = oDocument_g.GetRecord( "TPoll" ); // get poll record
               oDBRecord.ClearValues();

               if( aPollResult.length > 1)
               {
                  oDBRecord.SetValue( aPollResult );
                  oDBRecord.SetKeyValue( sKey );
                  oDocument_g.key_ = sKey;

                  oDBRecord.WriteValues();

                  PAGE_UpdateFieldLabels(document.querySelector("#idFieldLabels"));
               }

               PAGE_Update();
            });
            return;
         }

         if(!eTarget.dataset.action) return;
         e_.stopPropagation();

         const aFields = eContainer.querySelectorAll("[data-field]");
         const oFields = {};

         aFields.forEach((eField) => {
            const sField = eField.dataset.field;
            const sValue = eField.value;
            oFields[sField] = sValue;
         });

         console.log(oFields);

         const sAction = eTarget.dataset.action;

         // ## User table record and action .....................................
         const oDBRecord = oDocument_g.GetRecord( "TPoll" );                                          console.assert( oDBRecord, "oDBRecord is null" );

         oDBRecord.ReadValues();

         switch(sAction) {
            case "search": {
               const sQueryName = "vote-poll_search";
               const sSearchValue = eContainer.querySelector('[data-field-type="search"]').value;
               const sArguments = "query=#" + sQueryName + "\n" + `values=${JSON.stringify({name: sSearchValue})}`;

               gd.SendToServer("", "!db/select?", sArguments).then(function(oResult) {
                  PAGE_ProcessResponse(oResult, "select-polls");
               });
            } break;
            case "poll-add": {
               const sValues = JSON.stringify(oDBRecord.GetFilledValues());
               const oArguments = `{ "table": "TPoll", "values": ${sValues}, "returning": "PollK" }`;
               const sArguments = `record=${oArguments}`;
               gd.SendToServer("", "!db/insert?", sArguments).then(function(oResult) {
                  PAGE_ProcessResponse(oResult);
                  CreateButtons(document.querySelector("#idButtons"));
                  oToast_g.Show("Skapad!")
                  PAGE_TableUpdate();
               });
            } break;
            case "poll-update": {
               const sKey = oDBRecord.GetKeyValue();
               const sValues = JSON.stringify(oDBRecord.GetFilledValues());
               const sWhere = `{"PollK": "${sKey}"}`;
               let sArguments = `{ "table": "TPoll", "values": ${sValues}, "where": ${sWhere} }`;
               sArguments = `record=${sArguments}`;
               gd.SendToServer("", "!db/update?", sArguments).then(function(oResult) {
                  let iCount = JSON.parse(oResult.data.querySelector("result").textContent).count;

                  if( iCount !== 0) { oToast_g.Show("Updaterad!"); }
                  else {oToast_g.Show("Kunde inte uppdatera")}
               });
            } break;
            case "poll-delete": {
               const sKey = oDBRecord.GetKeyValue();
               const sWhere = `{"PollK": "${sKey}"}`;
               let sArguments = `{ "table": "TPoll", "where": ${sWhere} }`;
               sArguments = `record=${sArguments}`;

               gd.SendToServer("", "!db/delete?", sArguments).then(function(oResult) {
                  let iCount = JSON.parse(oResult.data.querySelector("result").textContent).count;

                  if( iCount !== 0) { 
                     PAGE_TableUpdate();
                     oToast_g.Show("Raderad!"); 
                  }
                  else {oToast_g.Show("Kunde inte ta bort")}
               });

            } break;
            case "poll-open": {
               // Open poll questions page, pass selected poll key as parameter
               const oDBPollRecord = oDocument_g.GetRecord("TPoll");
                  const sPollKey = oDBPollRecord.GetKeyValue();                console.assert(sPollKey, "sPollKey is null or empty");

                  window.location.href = `page_poll_question_edit.html?key=${encodeURIComponent(sPollKey)}`;
            } break;
            case "poll-open": {
               // Open poll questions page, pass selected poll key as parameter
               const oDBPollRecord = oDocument_g.GetRecord("TPoll");
                  const sPollKey = oDBPollRecord.GetKeyValue();                console.assert(sPollKey, "sPollKey is null or empty");

                  window.location.href = `page_poll_question_edit.html?key=${encodeURIComponent(sPollKey)}`;
            } break;
            case "poll-cast": {
               // Open poll casting page, pass selected poll key as parameter
               const oDBPollRecord = oDocument_g.GetRecord("TPoll");
                  const sPollKey = oDBPollRecord.GetKeyValue();                console.assert(sPollKey, "sPollKey is null or empty");

                  window.location.href = `page_cast.html?key=${encodeURIComponent(sPollKey)}`;
            } break;
            case "poll-result": {
               // Open poll result page, pass selected poll key as parameter
               const oDBPollRecord = oDocument_g.GetRecord("TPoll");
                  const sPollKey = oDBPollRecord.GetKeyValue();                console.assert(sPollKey, "sPollKey is null or empty");

                  window.location.href = `page_cast_result.html?key=${encodeURIComponent(sPollKey)}`;
            } break;
            default:
               console.error("Unknown action:", sAction);
         }

      });

   }

   /** ---------------------------------------------------------------------
    * Handle response data from server and display it in the container
    *
    * Response data format is { type: <format>, data: <data> } and type can be any of
    * json, xml or text. "type" is the format of the data, e.g. "json", "xml", "text"
    *
    * @param {object} oData - The response data to process, format is { type: <format>, data: <data> }
    */
   function PAGE_ProcessResponse(oData, sOperation) {
      let sResult = '';
      let eResults = null;

      switch(oData.type) {
         case 'json':
            sResult = JSON.stringify(oData.data, null, 2);
            break;
         case 'xml':
            // If oData.data is an XML Document object, serialize it to string
            /*if (oData.data instanceof XMLDocument || oData.data.nodeType === 9) {
               sResult = (new XMLSerializer()).serializeToString(oData.data);
            } else {
               // If it's already a string, use it directly
               sResult = oData.data;
            }*/

            /*console.log(oData.data);
            let sValue = JSON.parse(oData.data.querySelector("result").textContent);
            sResult = sValue.key;
            oDocument_g.key_ = sResult;
            */

            // If oData.data is an XML Document object, serialize it to string
            if (oData.data instanceof XMLDocument || oData.data.nodeType === 9) {
               //sResult = (new XMLSerializer()).serializeToString(oData.data);

               // ## query results element
               eResults = oData.data.querySelector('results');                   // get results element holding result elements
            } else {
               // If it's already a string, use it directly
               sResult = oData.data;
            }

            break;
         case 'text':
            sResult = oData.data;
            break;
         default:
            console.error("Unknown response type:", oData.type);
      }
      

      if(eResults)
      {
         if( sOperation === "select-polls")
         {
            const eSelect = eResults.querySelector('result[command="select"]');
            const aPoll = JSON.parse(eSelect.textContent);
            aPoll.shift();

            const eSelectPoll = document.getElementById("idContainer").querySelector('[data-section="select-polls"]');
            eSelectPoll.innerHTML = "";

            let oTable = oDocument_g.GetTable("search");
            if(!oTable)
            {
               oTable = new Table(["id", "name", "header"], {sName: "search"} );
               oDocument_g.AddTable(oTable);
            }
            else
            {
               oTable.Clear();
            }
            

            // loop array and add rows to table
            for(const aRow of aPoll) {oTable.Add(aRow);}

            PAGE_Update("search");

            const fnSelectPoll = (sEvent, oParameter) => {
               if(sEvent === "row")
               {
                  const iRow = oParameter.iOriginalIndex;
                  const eRow = oParameter.eRow;
                  const sKey = oTable.GetCell(iRow, 0);
                  eRow.dataset.key = sKey;
               }
            };
            
         }
      }

      
   }
   </script>
</body>
</html>
