<!--
## Edit poll questions and answers for each question.

Importanbt data attributes are data-action, data-section. These are both used for
command and simplify navigation in page.

PAGE_ Method documentation:
=========================

PAGE_Initialize - Main initialization function that sets up the page, creates draggable elements and configures listeners
PAGE_LoadPollInformation - Retrieves and sets up poll information, main poll, questions and anwswers
PAGE_SetListeners - Configures event listeners for page interactions, handling actions like send and save
PAGE_RenderForm - Render UI elements for record
PAGE_Update - Update UI elements
PAGE_OnIdle - Handles idle state by updating UI elements and checking for changes
PAGE_ProcessResponse - Processes the response from the server and updates the UI accordingly
PAGE_Message - Displays a message based on the response from the server, showing success or error messages as needed

Message_d - For development, display message in page

RECORD_GetPoll - Get poll data from server using poll key

data-section documentation ====================================================

data-section="page" - Section for the page content.
data-section="poll-active" -  Section for the active poll.
data-section="question-list" - Container for the question list, questions are placed as a list where you can expand and see the answers.
data-section="answer-list" - Container for the answer list, answers are placed as a list where you can expand and see the details.

Tables columns used ===========================================================
TPoll: PollK, FName, FHeader, FDescription
TPollQuestion: PollQuestionK, FName, FLabel, FDescription
TPollAnswer: PollAnswerK, PollQuestionK, FName, FLabel, FDescription

Queries used in page ==========================================================
vote-get_first - Get first poll key for development and testing purposes
vote-count - Count polls for poll key
vote-count_questions - Count questions for poll key
vote-get - Select active poll details
vote-get_polls - Select poll questions for poll
vote-get_answers - Select poll answers for poll



-->

      if( eField ) { eField.value = this.GetValue(sName); }
   };

   oDocument_g = new CDocument({});                                           // Create new document

   // ## Create record containers for poll, question and answer tables ........

   let oRCPoll = new DBRecordContainer("FName,Name,string;FHeader,Header,string;FDescription,Description,string", { fnRead, fnWrite });

   oDocument_g.AddRecord(oRCPoll);                                                        // add record to document

   // TPollQuestion
   let oRCPollQuestion = new DBRecordContainer("FName,Name,string;FLabel,Header,string;FDescription,Description,string;PollK,,string", { fnRead, fnWrite });
   oRCPollQuestion.table = "TPollQuestion";
   oDocument_g.AddRecord(oRCPollQuestion);

   // TPollAnswer

   oRCPollAnswer.table = "TPollAnswer";
   oDocument_g.AddRecord(oRCPollAnswer);


   let sPollKey = null; // Get poll key from url parameters if available, otherwise use null to fetch first poll

   // try to get poll key from url parameters, if not available use null to fetch first poll
   const oUrlParameter = new URLSearchParams(window.location.search);
   sPollKey = oUrlParameter.get("PollK") || null;

         sPollKey = XML_GetFirstValue(oResult);
         oDocument_g.SetValue("PollK", sPollKey);                              // Store poll key in document values for later use

      PAGE_RenderForm( oDocument_g.GetElement("record"), aFieldQuestion );

function PAGE_LoadPollInformation() {
   const sPollKey = oDocument_g.GetValue("PollK");
   if( !sPollKey ) { throw new Error("Poll key is not set in document values"); }

   const sNewLine = "\n";
   gd.SendToServer("", "!db/select", `query=#vote-get${sNewLine}values=${JSON.stringify({ PollK: sPollKey })}`).then(function(oResult) {
      const aTable = XML_GetFirstArray( oResult );
      if( aTable.length <= 1 ) { throw new Error("No poll found for poll key: " + sPollKey); }

      const tableVote = new Table(aTable); // Convert the XML response to a Table object for easier data manipulation
      const oPoll = tableVote.AsJson(0, 1)[0];  // Get poll information as json

      Message_d(`Poll information loaded for poll: ${JSON.stringify(oPoll)}`); // Display message that poll information is loaded

      // ## Set poll information in document values and render form
      oDocument_g.GetRecord("TPoll").SetValue(oPoll);
      const oDBRecordContainer = oDocument_g.GetRecord("TPoll");

      //oDBRecordContainer.BindContainer( document.getElementById("idPoll") ); // Bind the record container to the poll container in the DOM
      oDBRecordContainer.WriteValues("idPoll");


   }).catch(function(error) {
      console.error("Error fetching poll details:", error);
      oToast_g.Show("Error fetching poll details: " + error.message, { type: "error" });
   });

   const fnRenderVotes = function( oTable ) {
      const eQuestions = document.getElementById("idQuestions");
      let sQuestionK = null;
      for( let uRow = 0; uRow < oTable.GetRowCount(); uRow++ ) {
         const sCheckQuestionK = oTable.GetCellValue(uRow, "PollQuestionK");
         if( sCheckQuestionK !== sQuestionK ) {
            sQuestionK = sCheckQuestionK;
            // ## Geneate html for new question
            const eQuestion =  document.getElementById("idTemplateQuestion").content.cloneNode(true).firstElementChild;
            eQuestions.appendChild(eQuestion);
            let oRow = oTable.GetRowData(uRow, { format: "json" });            // Get question data as json and attach to question element for later use
            // regex filter for all fields that start with capital "Q"
            oTable.GetRowData(uRow, { format: "json", append: oRow, filter: /^Q/ }); // add capital Q fields to question data
            // iterate all values and remove the capital Q if first
            Object.keys(oRow).forEach(sKey => {
               if( sKey.startsWith("Q") ) { oRow[sKey.substring(1)] = oRow[sKey]; } // remove capital Q from key 
            });
            FIELD_CopyValues( oRow, eQuestion );                               // Copy poll key and question key values from question data to question form hidden input fields
         }
      }
   };


   gd.SendToServer("", "!db/select", "query=#vote-all_questions\n" + `values={"PollK":"${sPollKey}"}`).then(function(oResult) {
      const data_ = oResult.data;
      const aResult = JSON.parse( data_.querySelector("result").textContent ); // first result holds array
      const oTable = new Table(aResult);
      fnRenderVotes( oTable );
   }).catch(function(error) {
      console.error("Error fetching poll questions:", error);
      oToast_g.Show("Error fetching poll questions: " + error.message, { type: "error" });
   });


}

function PAGE_SetListeners() {
   const ePage = document.querySelector('[data-section="page"]'); // get page container that holds the complete page
   ePage.addEventListener("click", function(e_) {
      const eTarget = e_.target;

      const sCommand = eTarget.dataset.command;
      if( !sCommand ) return;                                                 // If no command is defined, return
      const eForm = eTarget.closest('[data-section="form"]');                 // Container element for form based on command
      const eFormList = eTarget.closest('[data-section="form-list"]');        // Continer list for forms based on command

      const sTableName = eTarget.dataset.table;                                                 console.assert( sTableName, "Table name is not defined in data-table attribute" );
      const sAction = eTarget.dataset.action;                                                      console.assert( sAction, "Action is not defined in data-action attribute" );

      let oDBRecord = oDocument_g.GetRecord(sTableName);                                           console.assert( oDBRecord, `No record found for table ${sTableName}` );

      // ## TPoll commands ....................................................
      if( sTableName === "TPoll" ) {
         oDBRecord.ClearValues();
         oDBRecord.ReadValues("idPoll");
         switch( sCommand ) {
            case "update": {
               const oValues = oDBRecord.GetAllValues();
               const [ oDocument, eValues ]  = XML_AppendObject(null, oValues, "values", "value"); // Convert values to XML format for sending to server
               eValues.setAttribute("table", "TPoll");
               XML_AppendObject(eValues, { PollK: oDocument_g.GetValue("PollK") }, undefined, "where"); // Append poll key to values for updating the correct poll in the database

               gd.SendToServer("", "!db/update", `table=TPoll`, oDocument).then(function(oResponse) {
                  PAGE_Message({table: "TPoll", command: "update", response: oResponse, status: "success"}); // Process response and show message
               }).catch(function(error) {
                  PAGE_Message({table: "TPoll", command: "update", response: oResponse, status: "error" }); // Process response and show message
               });
            } break;
            case "delete":
               console.log("Delete poll command triggered");
               break;
            default:
               console.error(`Unknown command: ${sCommand} for table ${sDatabaseTableName}`);
         }
      }

      // ## TPollQuestion commands ............................................
      else if( sTableName === "TPollQuestion" ) {
         if( eForm ) {
            oDBRecord.ClearValues();
            oDBRecord.ReadValues( eForm );
         }
         switch( sCommand ) {
            case "cancel": // Cancel the current operation adding new question
               document.getElementById("idNewQuestion").remove(); // Remove the new question form from the page
               break;
            case "new": {
               if( document.getElementById("idNewQuestion") !== null ) { Message_d("New question is already open. Please close it before adding a new one.  ", "error"); return; }

               // ## Clone the html table idQuestions and add to page
               const eTemplateQuestion = document.getElementById("idTemplateNewQuestion");
               const eNewQuestionFragment = eTemplateQuestion.content.cloneNode(true);
               const eNewQuestion = eNewQuestionFragment.firstElementChild;
               eNewQuestion.setAttribute("id", "idNewQuestion");               // Set id value to cloned question elemet ()
               document.getElementById("idQuestions").appendChild(eNewQuestion);
               eNewQuestion.querySelector(`[data-field="PollK"]`).value = oDocument_g.GetValue("PollK"); // Set poll key value in hidden input field for new question form
            } break;
            case "insert": {
               const oValues = oDBRecord.GetAllValues();
               const [ oDocument, eValues ]  = XML_AppendObject(null, oValues, "values", "value"); // Convert values to XML format for sending to server
               XML_AppendElement(eValues, { name: "PollQuestionK" },undefined, "returning"); // append returning field.
               eValues.setAttribute("table", "TPollQuestion");
               gd.SendToServer("", "!db/insert", `table=${sTableName}`, oDocument).then(function(oResponse) {
                  // ## Replace html form for adding new question with html form for question prepared to add answers
                  const eNew =  document.getElementById("idTemplateQuestion").content.cloneNode(true).firstElementChild; // oneliner for: gets template, clones the html and get element to cloned html
                  const eOld = document.getElementById("idNewQuestion"); // html form for adding new question
                  const eParent = eOld.parentNode;
                  FIELD_CopyValues(eOld, eNew); // Copy values from new question form to question form
                  const sNewQuestionK = XML_GetFirstValue(oResponse);
                  eNew.querySelector(`[data-field="PollQuestionK"]`).value = sNewQuestionK; // Set the new question key value in hidden input field
                  eParent.replaceChild(eNew, eOld);
                  //PAGE_Message({table: sTableName, command: "insert", response: oResponse, status: "success"}); // Process response and show message
               }).catch(function(error) {
                  PAGE_Message({table: sTableName, command: "insert", response: oResponse, status: "error" }); // Process response and show message
               });
            } break;
            case "update": {
               const oValues = oDBRecord.GetAllValues();
               const [ oDocument, eValues ]  = XML_AppendObject(null, oValues, "values", "value"); // Convert values to XML format for sending to server
            } break;
            default:
               console.error(`Unknown command: ${sCommand} for table ${sDatabaseTableName}`);
         }
      }

      // ## TPollAnswer commands ..............................................
      else if( sTableName === "TPollAnswer" ) {
         switch( sCommand ) {
            case "new": {
               // ## Clone the html fragment for new answer and add to page
               const eQuestion = eFormList.querySelector('[data-table="TPollQuestion"]'); // Get question form container for current answer form based on command
               const eAnswer = document.getElementById("idTemplateAnswer").content.cloneNode(true).firstElementChild;
               FIELD_CopyValues(eQuestion,  eAnswer, ["PollK", "PollQuestionK"] ); // Copy poll key and question key values from question form to answer form
               eFormList.appendChild(eAnswer); // Append new answer form to the question form list
            } break;
            case "insert":
               console.log("Insert answer command triggered");
               break;
            default:
               console.error(`Unknown command: ${sCommand} for table ${sDatabaseTableName}`);
         }
      }
      else {
         console.error(`Unknown table: ${sDatabaseTableName}`);
      }
   });
}

/** ---------------------------------------------------------------------------
 *
 */
function PAGE_RenderForm( eContainer, aFields ) {
   // ## Prepare fields to set where new row is created .......................
   let bCols = false;
   aFields.forEach(oField => {
      if( !oField.label ) return;
      if( !oField.cols || bCols === false ) { oField.bRow = true; }

      if( oField.cols ) { bCols = true }
      else { bCols = false }
   });

   // print fields
   console.log(aFields);

   aFields.forEach(oField => {
      if( !oField.label ) return;

      // ## Prepare row for field .............................................
      let eDivRow;
      if(oField.bRow) {
         eDivRow = document.createElement('div');
         eDivRow.className = 'grid-row';
         if(oField.cols) { eDivRow.classList.add(`cols-${oField.cols}`); }
         eDivRow.style.marginTop = '20px';
         eContainer.appendChild(eDivRow);
      }
      else { eDivRow = eContainer.lastElementChild; }

      // ## Prepare label for field ...........................................
      const eLabel = document.createElement('label');
      eLabel.className = 'floating';

      // ### Add span class if span is defined
      if( oField.span ) { eLabel.classList.add(`col-span-${oField.span}`); }



      let sTagName = "input";
      let sType = oField.type;
      if( sType === "text" ) { sTagName = "textarea"; }
      const eInput = document.createElement(sTagName);
      if( sType === "text" ) { eInput.rows = 3; }
      else { eInput.type = oField.input || 'text'; }
      eInput.placeholder = ' ';
      eInput.required = oField.required;
      eInput.dataset.field = oField.field;

      // ## Prepare label for field ...........................................
      const eSpan = document.createElement('span');
      eSpan.textContent = oField.label;

      eLabel.appendChild(eInput);
      eLabel.appendChild(eSpan);
      eDivRow.appendChild(eLabel);
   });
}

/** -------------------------------------------------------------------------- PAGE_OnIdle
 * Handles idle state by updating UI elements and checking for changes
 */
const PAGE_OnIdle = (function() {
  var bLastModified = false;

  return function() {
     const bModified = oDocument_g.IsModified();

     if( bModified !== bLastModified ) {

        bLastModified = bModified;
     }
  }
})();


/** -------------------------------------------------------------------------- PAGE_Message
 * Processes the response from the server and updates the UI accordingly
 */
function PAGE_Message( response_, sType = "info" ) {

   // If response is a string, show it directly as a message
   if( typeof response_ === "string" ) { oToast_g.Show(response_, { type: sType });  return; }

   const oResponse = response_ || {};

   const sTable = oResponse.table || "unknown table";
   sType = oResponse.type || sType;
   const sStatus = oResponse.status || "unknown status";
   const sCommand = oResponse.command || "unknown command";

   if( sTable === "TPoll" ) {
      let sMessage = "Poll ";
      switch( sCommand ) {
         case "update": sMessage += "updated "; break;
      }
   }
   else if( sTable === "TPollQuestion" ) {
      let sMessage = "Question ";
      switch( sCommand ) {
         case "insert": sMessage += "added "; break;
         case "update": sMessage += "updated "; break;
         case "delete": sMessage += "deleted "; break;
      }
   }
   else if( sTable === "TPollAnswer" ) {
      let sMessage = "Answer ";
      switch( sCommand ) {
         case "insert": sMessage += "added "; break;
         case "update": sMessage += "updated "; break;
         case "delete": sMessage += "deleted "; break;
      }
   }
   else {
      console.error(`Unknown table: ${sTable}`);
   }

   if( oResponse.success ) {
      oToast_g.Show(sMessage + "successfully", { type: "success" });
   }
   else {
      oToast_g.Show(`Error ${sMessage.toLowerCase()}: ${oResponse.error || "Unknown error"}`, { type: "error" });
   }
};


// For development, display message in page
function Message_d( message_, sType = "info" ) {
   if( typeof message_ === "string" && message_.length < 80 ) {
      PAGE_Message( message_, sType );
      return;
   }
   const eMessage = document.getElementById("idMessage");
   let sMessage = "Message: ";
   if( typeof message_ === "object" ) { sMessage += JSON.stringify(message_); }
   else { sMessage = message_; }
   eMessage.textContent = sMessage;
}
